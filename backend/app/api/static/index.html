<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>小红书多角色生成</title>
<style>
  :root { --line:#e5e7eb; --muted:#6b7280; --accent:#be123c; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:#1f2328; background:#fafafa; }
  header { padding:14px 20px; background:#fff; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:baseline; }
  header h1 { font-size:16px; margin:0; }
  header span { color:var(--muted); font-size:12px; }
  main { display:grid; grid-template-columns: 300px 1fr 1fr; gap:16px; padding:16px; align-items:start; }
  section { background:#fff; border:1px solid var(--line); border-radius:8px; padding:14px; }
  h2 { font-size:13px; margin:0 0 10px; color:var(--muted); font-weight:600; letter-spacing:.4px; }
  label { display:block; font-size:12px; color:var(--muted); margin:8px 0 2px; }
  input, textarea { width:100%; font:inherit; font-size:13px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; }
  textarea { min-height:56px; resize:vertical; }
  button { margin-top:12px; width:100%; padding:9px; border:0; border-radius:6px; background:var(--accent); color:#fff; font-size:14px; cursor:pointer; }
  button:disabled { background:#d1d5db; cursor:default; }
  #timeline { list-style:none; margin:0; padding:0; font-size:13px; max-height:640px; overflow:auto; }
  #timeline li { padding:6px 0; border-bottom:1px dashed var(--line); display:flex; gap:8px; }
  .node { font-family:ui-monospace,Consolas,monospace; color:#111827; }
  .ok { color:#047857; } .err { color:#b91c1c; }
  .muted { color:var(--muted); font-size:12px; }
  #cover { display:inline-block; background:#fff1f2; color:var(--accent); padding:4px 8px; border-radius:5px; font-weight:600; }
  #body { white-space:pre-wrap; line-height:1.7; font-size:14px; }
  .tags span { display:inline-block; background:#eef2ff; color:#4338ca; font-size:12px; padding:2px 7px; border-radius:4px; margin:3px 4px 0 0; }
  .kv { font-size:12px; color:var(--muted); margin-top:6px; }
</style>
</head>
<body>
<header>
  <h1>小红书多角色笔记生成</h1>
  <span>七角色讨论循环 · 读者来自另一家厂商 · 判定卡由代码算</span>
</header>

<main>
  <section>
    <h2>输入</h2>
    <label>身份（nickname）</label><input id="nickname" value="沪漂第三年的市场岗打工人">
    <label>年龄 / 城市 / 职业</label>
    <input id="age" value="25-30"><input id="city" value="上海" style="margin-top:6px"><input id="occupation" value="市场营销" style="margin-top:6px">
    <label>目标（goal）</label><input id="goal" value="涨粉">
    <label>语气（tone，逗号分隔）</label><input id="tone" value="自嘲,直给">
    <label>真实经历（real_material，每行一条）</label>
    <textarea id="material">被二房东坑过一个月押金，最后靠报警才要回来一半
中介带我看房时说这栋楼隔音差，我当时没听懂</textarea>
    <label>禁区（taboo，逗号分隔）</label><input id="taboo" value="不提公司名">
    <label>主题</label><input id="topic" value="租房第一年我终于搞清楚的事">
    <button id="run">开始生成</button>
    <div class="kv" id="hint">提交后左侧会返回 run_id，中间实时滚动过程。</div>
  </section>

  <section>
    <h2>过程</h2>
    <ul id="timeline"></ul>
  </section>

  <section>
    <h2>结果</h2>
    <div id="cover"></div>
    <h3 id="title" style="font-size:16px;margin:10px 0 6px"></h3>
    <div id="body"></div>
    <div class="tags" id="tags"></div>
    <div class="kv" id="verdict"></div>
    <div class="kv" id="meta"></div>
    <p><a id="report" href="#" target="_blank">打开完整过程报告 →</a></p>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const lines = (v) => v.split("\n").map(s => s.trim()).filter(Boolean);
const csv = (v) => v.split(/[,，]/).map(s => s.trim()).filter(Boolean);

$("run").onclick = async () => {
  const persona = {
    nickname: $("nickname").value,
    age_range: $("age").value,
    city: $("city").value,
    occupation: $("occupation").value,
    goal: $("goal").value,
    tone: csv($("tone").value),
    real_material: lines($("material").value),
    taboo: csv($("taboo").value),
  };
  $("run").disabled = true;
  $("timeline").innerHTML = "";
  $("hint").textContent = "提交中…";

  const resp = await fetch("/runs", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ persona, topic: $("topic").value }),
  });
  const { run_id } = await resp.json();
  $("hint").textContent = `run_id: ${run_id}`;
  $("report").href = `/runs/${run_id}/report`;

  const es = new EventSource(`/runs/${run_id}/events`);
  es.onmessage = (msg) => handle(JSON.parse(msg.data));
  es.addEventListener("node_start", (m) => handle(JSON.parse(m.data)));
  es.addEventListener("node_end", (m) => handle(JSON.parse(m.data)));
  es.addEventListener("result", (m) => { handle(JSON.parse(m.data)); es.close(); $("run").disabled = false; });
  es.addEventListener("error", () => { $("hint").textContent += "（连接中断，快照仍可查）"; es.close(); $("run").disabled = false; });
};

function handle(ev) {
  if (ev.event === "node_start" || ev.event === "node_end") {
    const li = document.createElement("li");
    li.innerHTML = `<span class="node">${ev.node}</span>
      <span class="${ev.event === "node_end" ? "ok" : "muted"}">${ev.event === "node_start" ? "开始" : "完成"}</span>
      <span class="muted">第 ${ev.round} 轮</span>`;
    $("timeline").appendChild(li);
  } else if (ev.event === "error") {
    const li = document.createElement("li");
    li.innerHTML = `<span class="err">失败：${ev.message}</span>`;
    $("timeline").appendChild(li);
  } else if (ev.event === "result") {
    render(ev.data);
  }
}

function render(data) {
  if (!data) return;
  $("cover").textContent = data.cover_text || "";
  $("title").textContent = data.title || "（没有标题）";
  $("body").textContent = data.body || "";
  $("tags").innerHTML = (data.tags || []).map(t => `<span>${t}</span>`).join("");
  const meta = data.meta || {};
  const checks = (meta.failed_checks || []).map(c => `${c.label}：${c.detail}`).join("；");
  $("verdict").textContent = `状态 ${data.status}｜${meta.rounds_used || 0} 轮｜交付第 ${meta.best_round ?? "—"} 轮` +
    (checks ? `｜未达标：${checks}` : "");
  const usage = meta.usage || {};
  $("meta").textContent = `成本 ${usage.cost_cny ?? 0} 元｜${usage.calls ?? 0} 次调用｜${usage.elapsed_s ?? 0} 秒`;
}
</script>
</body>
</html>
