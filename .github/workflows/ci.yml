name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: cd backend && uv sync --frozen --group dev
      - name: Tests (offline, no real API)
        run: cd backend && uv run pytest -q
      - name: Lint
        run: cd backend && uv run ruff check app tests
      - name: Types
        run: cd backend && uv run mypy app
      - name: Design invariants (C1–C6)
        run: python scripts/check_invariants.py --root .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile
      - name: Typecheck
        run: cd frontend && pnpm typecheck
      - name: Build
        run: cd frontend && pnpm build
